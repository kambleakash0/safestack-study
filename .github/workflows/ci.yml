name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.13"
      - name: Sync (base + dev, no torch)
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test (mock path; hf tests excluded)
        run: uv run pytest -m 'not hf'
