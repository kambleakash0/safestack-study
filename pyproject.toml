[project]
name = "safestack"
version = "0.0.1"
description = "Defense-in-depth evaluation for safety-aligned open LLMs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "typer>=0.12",
]

[project.optional-dependencies]
# Local weight loading (tiny model on the laptop; the 7B on a cloud GPU later).
# torch 2.6 is the first cp313 macOS-arm64 wheel; kept out of base so the mock path is torch-free.
# transformers>=4.56 for the `dtype` kwarg (torch_dtype was renamed) and to allow 5.x, which lifts
# the huggingface-hub<1.0 cap that conflicted with Colab's preinstalled stack. No upper cap: pin via
# uv.lock locally, and run.json records the exact versions for cloud runs.
hf = [
    "torch>=2.6",
    "transformers>=4.56",
    "peft>=0.11",
]
# Hosted (OpenAI-compatible) inference backend, e.g. Mistral La Plateforme.
api = [
    "httpx>=0.27",
]
data = ["datasets>=3"]
# SFT training (LoRA/QLoRA): the hf + data stack plus bitsandbytes/accelerate. Kept out of `hf` so the
# eval/inference path stays lean. bitsandbytes (4-bit QLoRA) is CUDA-only, so this extra is installed on
# the GPU box (Colab), not the mock/CI path -- the pure trainer tests import nothing from it (the
# trainer lazy-imports torch/transformers/peft inside the training call). Assistant-only loss is done
# with a length-based label mask on transformers Trainer, so no trl dependency.
train = [
    "safestack[hf,data]",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]
viz = ["matplotlib>=3.8"]
# lm-eval[ifeval] pulls IFEval's scoring deps (langdetect/immutabledict/nltk); the leaderboard_ifeval
# task import errors without them. NOTE: nltk also needs a runtime punkt download on the GPU box.
capability = ["safestack[hf]", "lm-eval[ifeval]>=0.4.4,<0.5"]

[project.scripts]
safestack = "safestack.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["safestack"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
flake8-bugbear = { extend-immutable-calls = ["typer.Option", "typer.Argument"] }

[tool.pytest.ini_options]
addopts = "-m 'not hf' --import-mode=importlib"
markers = [
    "hf: needs the hf extra (torch/transformers)",
]
testpaths = ["tests"]

[tool.uv]
# Dependency cooldown: don't resolve packages published in the last 7 days.
exclude-newer = "7 days"
