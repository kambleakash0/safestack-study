model_id: stress_mistral_lora_b250
backend: hf_local
# Frozen base = the C1/C5 Mistral card (ADR-0002/0004): identical checkpoint + pinned revision, so
# C9(b)/C10(b) differ from C5 only by the stressed LoRA adapter -- budget-0 = C5 anchors the
# dose-response (ADR-0017 dec.4).
checkpoint: mistralai/Mistral-7B-Instruct-v0.3
revision: c170c708c41dac9275d15a8fff4eca08d52bab71  # pinned SHA of Mistral-7B-Instruct-v0.3
# The robustness-stressed LoRA adapter (ADR-0017 dec.3): the C5 SFT adapter continue-trained on the
# b250 stress slice. PRIVATE, never public (dec.7 as amended by Amendment 2); adapters/ is gitignored.
adapter: kambleakash0/safestack-stress-mistral-lora-b250
# Immutable adapter pin: the FU3b upload commit SHA, so C9(b)/C10(b) share one immutable policy identity
# (every fingerprint field matches -> C10(b) cache-hits C9(b)) and a re-train at the repo is a cache miss.
adapter_revision: eb845b9dc37f2497a7784c2778b5b499c0eb0a0e
chat_template: mistral
dtype: bfloat16          # bf16 base (not 4-bit) at inference, matching C1/C5 for comparability (dec.4)
quantization:            # null: the QLoRA-trained adapter is served on the bf16 base (dec.4)
device: cuda
notes: "Stressed policy card (budget 250): the bare policy = C9(b), +guardrails = C10(b). Base+LoRA
  load needs the ADR-0015 dec.7a gateway path. Deliberately-degraded, PRIVATE, NEVER public or a
  release candidate (ADR-0017 dec.7). Runs on a cloud GPU."
