# DPO-unalignment CROSS-CHECK run config (ADR-0019 dec.2/3), dose b411 on the leakage-clean toxic-dpo
# source. Continue-trains the aligned C5 adapter by DPO against an EXPLICIT frozen-C5 reference
# (ref_model=None is forbidden). Same C5 init + recipe as the LLM-LAT grid (only name / train_suite /
# output_adapter vary): an independent-provenance confirmation of the LLM-LAT b411 headline read.
name: dpo_toxicdpo_v1_b411
base_model: mistral_7b_instruct
train_suite: dpo_toxicdpo_v1_b411
train_split: train_dpo
output_adapter: adapters/dpo_toxicdpo_v1_b411
init_adapter: kambleakash0/safestack-sft-mistral-lora-v1
init_adapter_revision: 05266a9bd3fc1c75c515ea39ac5f7139abd77d31
beta: 0.1                 # FIXED across the dose grid, never dev-selected with the dose (dec.3)
learning_rate: 5.0e-6     # DPO uses a lower LR than SFT
num_train_epochs: 1.0     # dose-exact: each preference pair seen once
logging_steps: 1          # tiny doses run < the default 10 steps
save_strategy: epoch      # one adapter per budget
seed: 20250115
