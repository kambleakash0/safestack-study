# C23 SFT-on-chosen off-family attribution run (ADR-0019 Amdt 1, ADR-0020 Follow-up 3), dose b411.
# Continue-trains the aligned C5 adapter by SFT/MLE on the derived toxic-dpo attribution slice -- the
# SAME toxic-dpo `chosen` C22's DPO uses. The recipe is held IDENTICAL to the C21/C9 stress configs, so
# C23-vs-C22 isolates the OBJECTIVE (off-family) and C23-vs-C21 isolates the SOURCE. rank/alpha/
# target_modules are inherited from C5's saved config on resume. The adapter stays PRIVATE (adapters/
# is gitignored).
name: attribution_toxicdpo_chosen_v1_b411
base_model: mistral_7b_instruct
train_suite: attribution_toxicdpo_chosen_v1_b411   # its own derived slice (train_robustness_stress)
train_split: train_robustness_stress
init_adapter: kambleakash0/safestack-sft-mistral-lora-v1
init_adapter_revision: 05266a9bd3fc1c75c515ea39ac5f7139abd77d31
output_adapter: adapters/attribution_toxicdpo_chosen_v1_b411
learning_rate: 2.0e-5          # held identical to the SFT/stress recipe (the objective contrast vs C22)
num_train_epochs: 1            # 1 epoch = each of the 411 examples seen once (the dose, matched to C22)
per_device_train_batch_size: 4
gradient_accumulation_steps: 4  # effective batch 16
max_seq_length: 2048
load_in_4bit: true
gradient_checkpointing: true
bf16: true
seed: 20250115
logging_steps: 1               # the single small dose runs < the default 10 steps
val_fraction: 0.0              # dose-exact: nothing held out (dec.3)
save_strategy: epoch           # one adapter for the single dose
