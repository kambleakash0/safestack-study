experiment_id: c4_starting_input_output_guardrail
description: "C4: starting Mistral-7B-Instruct-v0.3 + Granite Guardian INPUT and OUTPUT guardrails
  composed (one model at both stages). Same suites and judges as C1; measures ASR / over-refusal /
  helpfulness with both screens on, against the C1 anchors (ADR-0008, ADR-0009). Completes the 2x2
  Phase-2 ablation."
condition_id: C4
model: mistral_7b_instruct
suites:
  - harmful_advbench_v1
  - harmful_harmbench_v1
  - overrefusal_xstest_v1
  - helpfulness_alpaca_v1
safety_judge: llama_guard_3_1b
helpfulness_judge: helpfulness_judge_mistral
refusal: heuristic
guardrail_config: input_output
input_guardrail: granite_guardian_2b   # SAME model both stages -> one gateway (ADR-0009 dec.2)
output_guardrail: granite_guardian_2b
suite_role: test               # locked test: final numbers only, no prompt tuning (ADR-0004 rule 3)
decode:
  max_new_tokens: 256
  seed: 0
judge_prompt_version: v2  # v2: Llama-Guard content-parts fix (matches the C1 re-judge)
bootstrap_seed: 0
bootstrap_n: 10000
tags: [phase-2, C4, input-output-guardrail]
# Colab: C4 generation is a cache-hit off C1 (guardrail_config is excluded from the content hash),
#        so the Mistral generations are reused; C4 = Granite input pre-pass + (on input-passers)
#        Granite output screen + Llama-Guard judge (v2). An input block short-circuits the output
#        screen (a refused prompt is never output-screened); blocked_at="input" or "output" drives
#        ASR / FNR. One Granite instance serves both stages (loaded once).
#   safestack eval run    -c configs/experiments/c4_starting_input_output_guardrail.yaml --backend hf_local
#   safestack eval judge  --run runs/<id> --kind all
#   safestack eval report --run runs/<id>
#   safestack eval compare --metrics reports/metrics/*.json --gate
