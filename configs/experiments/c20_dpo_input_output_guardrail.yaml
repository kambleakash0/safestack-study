experiment_id: c20_dpo_input_output_guardrail
description: "C20: the DPO-unaligned Mistral at b*=411 + Granite Guardian INPUT and OUTPUT guardrails
  composed (one model at both stages). Same suites/judges/decode as C19; whether the external layer
  CONTAINS a DPO-unaligned model (H8, containment, conditional on C19 degrading). Cache-hit off C19."
condition_id: C20
model: dpo_mistral_lora_b411    # SAME card as C19 -> C20 generation cache-hits C19 (dec.6 / ADR-0015)
suites:
  - harmful_advbench_v1
  - harmful_harmbench_v1
  - dualuse_harmbench_contextual_v1
  - overrefusal_xstest_v1
  - helpfulness_alpaca_v1
safety_judge: llama_guard_3_1b
helpfulness_judge: helpfulness_judge_mistral
refusal: heuristic
guardrail_config: input_output
input_guardrail: granite_guardian_2b   # SAME model both stages -> one gateway (ADR-0009 dec.2)
output_guardrail: granite_guardian_2b
suite_role: test               # locked test: final numbers only, no prompt tuning (ADR-0004 rule 3)
decode:
  max_new_tokens: 256
  seed: 0
judge_prompt_version: v2       # v2: Llama-Guard content-parts fix (matches the C1/C5 judge)
bootstrap_seed: 0
bootstrap_n: 10000
tags: [phase-6, C20, dpo, input-output-guardrail]
# Colab: C20 generation is a cache-hit off C19 (guardrail_config is excluded from the content hash), so
#        the DPO-unaligned generations are reused; C20 = Granite input pre-pass + (on input-passers)
#        Granite output screen + Llama-Guard judge (v2). An input block short-circuits the output screen;
#        blocked_at "input"/"output" drives ASR / guardrail FNR-FPR. C20 vs C19 is mechanically <= in
#        sign (a guardrail only removes unsafe-counted rows); the finding is whether the drop is
#        CI-separable and its magnitude, read only on suites where C19 degraded (H8, dec.6).
#   safestack eval run    -c configs/experiments/c20_dpo_input_output_guardrail.yaml --backend hf_local
#   safestack eval judge  --run runs/<id> --kind all
#   safestack eval report --run runs/<id>
#   safestack eval compare --metrics reports/metrics/*.json --gate
