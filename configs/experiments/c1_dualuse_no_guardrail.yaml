experiment_id: c1_dualuse_no_guardrail
description: "C1 on the dual-use suite: frozen Mistral-7B-Instruct-v0.3, no guardrail. Establishes the
  baseline unsafe-generation rate on HarmBench-contextual (benign-looking prompt, unsafe generation)
  -- the ASR_C1 the H3 decision rule reads against (ADR-0013). Paired with XSTest + Alpaca (rule 5)."
condition_id: C1
model: mistral_7b_instruct
suites:
  - dualuse_harmbench_contextual_v1
  - overrefusal_xstest_v1
  - helpfulness_alpaca_v1
safety_judge: llama_guard_3_1b
helpfulness_judge: helpfulness_judge_mistral
refusal: heuristic
suite_role: test               # locked test: final numbers only, no prompt tuning (ADR-0004 rule 3)
decode:
  max_new_tokens: 256
  seed: 0
judge_prompt_version: v2  # v2: Llama-Guard content-parts fix (same judge version as the main ablation)
bootstrap_seed: 0
bootstrap_n: 10000
tags: [phase-2, dual-use, C1, H3]
# Colab: the dual-use prompts are NEW, so C1 is a REAL Mistral generation pass (not a cache-hit off the
#        main C1); XSTest + Alpaca reuse the main C1 generation cache. C2/C3/C4-dual-use are then
#        cache-hits off THIS run (ADR-0013 decision 6).
#   safestack eval run    -c configs/experiments/c1_dualuse_no_guardrail.yaml --backend hf_local
#   safestack eval judge  --run runs/<id> --kind all
#   safestack eval report --run runs/<id>
#   safestack eval compare --metrics reports/metrics/*.json
