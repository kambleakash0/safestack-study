experiment_id: c4_dualuse_input_output_guardrail
description: "C4 on the dual-use suite: frozen Mistral-7B + Granite Guardian INPUT and OUTPUT guardrails
  composed (one model, both stages). Completes the dual-use 2x2; expected to track C3 if output carries
  the H3 signal. Paired with XSTest + Alpaca (rule 5). ADR-0013."
condition_id: C4
model: mistral_7b_instruct
suites:
  - dualuse_harmbench_contextual_v1
  - overrefusal_xstest_v1
  - helpfulness_alpaca_v1
safety_judge: llama_guard_3_1b
helpfulness_judge: helpfulness_judge_mistral
refusal: heuristic
guardrail_config: input_output
input_guardrail: granite_guardian_2b   # SAME model both stages -> one gateway (ADR-0009 dec.2)
output_guardrail: granite_guardian_2b
suite_role: test               # locked test: final numbers only, no prompt tuning (ADR-0004 rule 3)
decode:
  max_new_tokens: 256
  seed: 0
judge_prompt_version: v2  # v2: Llama-Guard content-parts fix (matches the C1 anchors)
bootstrap_seed: 0
bootstrap_n: 10000
tags: [phase-2, dual-use, C4, H3, input-output-guardrail]
# Colab: cache-hit generate off c1_dualuse_no_guardrail; Granite input pre-pass + (on passers) output
#        screen. An input block short-circuits the output stage.
#   safestack eval run    -c configs/experiments/c4_dualuse_input_output_guardrail.yaml --backend hf_local
#   safestack eval judge  --run runs/<id> --kind all
#   safestack eval report --run runs/<id>
#   safestack eval compare --metrics reports/metrics/*.json
