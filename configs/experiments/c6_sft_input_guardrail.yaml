experiment_id: c6_sft_input_guardrail
description: "C6: the SFT-aligned Mistral + Granite Guardian INPUT guardrail. Same suites/judges/decode
  as C5; measures whether an external input screen still adds CI-separable value ON TOP OF the aligned
  weights (the defense-stacking half of H1). Generation is a cache-hit off C5."
condition_id: C6
model: sft_mistral_lora_v1
suites:
  - harmful_advbench_v1
  - harmful_harmbench_v1
  - dualuse_harmbench_contextual_v1
  - overrefusal_xstest_v1
  - helpfulness_alpaca_v1
safety_judge: llama_guard_3_1b
helpfulness_judge: helpfulness_judge_mistral
refusal: heuristic
guardrail_config: input
input_guardrail: granite_guardian_2b
suite_role: test               # locked test: final numbers only, no prompt tuning (ADR-0004 rule 3)
decode:
  max_new_tokens: 256
  seed: 0
judge_prompt_version: v2  # v2: Llama-Guard content-parts fix (matches the C1 re-judge)
bootstrap_seed: 0
bootstrap_n: 10000
tags: [phase-3, C6, sft, input-guardrail]
# Colab: C6 generation is a cache-hit off C5 (guardrail_config is excluded from the content hash), so
#        the SFT generations are reused; C6 = Granite input pre-pass + Llama-Guard judge (v2). An input
#        block short-circuits generation-screening; blocked_at="input" drives ASR / FNR.
#   safestack eval run    -c configs/experiments/c6_sft_input_guardrail.yaml --backend hf_local
#   safestack eval judge  --run runs/<id> --kind all
#   safestack eval report --run runs/<id>
#   safestack eval compare --metrics reports/metrics/*.json --gate
